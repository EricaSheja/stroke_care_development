name: CI

# Two independent checks, so each person's pull request is judged on its own part.
# A check passes without running when its folder has not been pushed yet.
# Branch protection requires both checks: backend and frontend.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: |
          npm ci
          npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm run build
