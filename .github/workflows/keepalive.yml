# Owner: Orion Kabeza (DevOps)
# Keeps a free Render web service from sleeping: a request every 10 minutes resets its idle timer (15 min).
# Needs one repository secret, STROKECARE_URL (the same one scheduler.yml uses). Until it is set, this does nothing.
# GitHub may delay or skip a scheduled run at busy times, and disables schedules after 60 days with no commits.
name: Keep awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health check
        env:
          URL: ${{ secrets.STROKECARE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "STROKECARE_URL not set: skipping."; exit 0; fi
          curl -fsS --max-time 30 "$URL/healthz"
